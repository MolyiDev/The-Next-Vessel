name = "the_next_vessel/molyi"
version = "0.1.0"
authors = ["molyi"]

[target]
environment = "roblox"

[indices]
default = "https://github.com/pesde-pkg/index"

[scripts]
roblox_sync_config_generator = ".pesde/scripts/roblox_sync_config_generator.luau"
sourcemap_generator = ".pesde/scripts/sourcemap_generator.luau"

[dev_dependencies]
scripts = { name = "pesde/scripts_rojo", version = "^0.2.0", target = "lune" }
rojo = { name = "pesde/rojo", version = "^7.5.1", target = "lune" }

[engines]
pesde = "^0.7.0"
lune = "^0.10.2"

[dependencies]
Signal = { name = "molyidev/signal", version = "^1.0.2" }
Ignis = { name = "molyidev/ignis", version = "^0.1.1" }
Butler = { name = "molyidev/butler", version = "^1.2.2" }
jecs = { name = "marked/jecs", version = "^0.9.0" }
